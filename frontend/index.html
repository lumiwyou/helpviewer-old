<!doctype html>
<html lang="en">
    <head>
        <title>HelpViewer Reader</title>
        <link id="style-import"
            rel="stylesheet"
            href=""
        ></link>
        <link id="favicon-import" rel="icon" type="image/x-icon" href="">
        <script id="utils-import" src=""></script>
    </head>
    <body>
        <header>
            <div id="title-area">
                <h3>HelpViewer Reader</h3>
            </div>
            <div id="credits-area">
                <p id="credits">developed by <a href="https://codeberg.org/lum1/">@lum1</a></p>
            </div>
        </header>
        <main>
            <form id="searchForm" action="javascript:void(0);">
                <label for="lsearch">Search:</label>
                <input type="text" id="terms" name="query" /><br /><br />
                <input
                    type="submit"
                    value="Submit"
                    onclick="search(this.form.terms.value)"
                />
                <input
                    readonly="true"
                    id="status"
                    placeholder="Awaiting user ..."
                />
                <img
                    id="loading"
                    src="/file?path=frontend/loading.gif"
                    hidden="true"
                />
            </form>
            <div id="dabox">
                <div id="results"></div>
                <aside id="preview_aside" style="float: right">
                    <iframe id="preview" href=""></iframe>
                </aside>
            </div>
        </main>
        <footer>
            <p>SPDX-License-Identifier: GPL-3.0 WITH bison-exception Copyright © 2024 lum1</p>
        </footer>
        <script>
        // Bootstrap script
        console.info("Running bootstrap");
        document.getElementById("style-import").href = `http://${location.host}/file?path=frontend/style.css`;
        document.getElementById("favicon-import").href = `http://${location.host}/file?path=frontend/favicon.ico`
        document.getElementById("loading").src = `http://${location.host}/file?path=frontend/loading.gif`
       var head = document.getElementsByTagName('head')[0];
       var script = document.createElement('script');
       script.type = 'text/javascript';
       script.src = `http://${location.host}/file?path=frontend/utils.js`;
       head.appendChild(script);
        </script>
    </body>
</html>
