<!doctype html>
<html lang="en">
    <head>
        <title>HelpViewer Reader</title>
        <link
            rel="stylesheet"
            href="http://localhost:8080/file?path=style.css"
        ></link>
    </head>
    <body>
        <header>
            <h3>HelpViewer Reader</h3>
        </header>
        <form id="searchForm" action="javascript:void(0);">
            <label for="lsearch">Search:</label>
            <input type="text" id="terms" name="query" /><br /><br />
            <input
                type="submit"
                value="Submit"
                onclick="search(this.form.terms.value)"
            />
            <input
                readonly="true"
                id="status"
                placeholder="Awaiting user ..."
            />
            <img
                id="loading"
                src="http://localhost:8080/file?path=loading.gif"
            />
            <script>
                document.getElementById("status").value = "";
            </script>
        </form>
        <div id="dabox">
            <div id="results"></div>
            <aside id="preview_aside" style="float: right">
                <iframe id="preview" href=""></iframe>
            </aside>
        </div>
        <script>
            const server = "http://localhost:8080/";
            async function search(terms) {
                const loading = document.getElementById("loading");
                const status = document.getElementById("status");
                loading.hidden = false;
                status.style = "background-color:#fcfca4;";
                status.value = "Querying ... ";
                try {
                    const res = await fetch(`${server}search?query=${terms}`);

                    if (!res.ok) {
                        throw new Error(`Response status: ${res.status}`);
                    }
                    status.value = "Received ... ";

                    const data = await res.json();

                    status.value = "Displaying ... ";
                    await displaySearchResults(data);
                    status.value = "Done ! ";
                    loading.hidden = true;
                    status.style = "background-color:#a4fca4;";
                } catch (error) {
                    loading.hidden = true;
                    status.value = error;
                    status.style = "background-color:#8F1717;";
                }
            }

            async function displaySearchResults(data) {
                const resultsList = document.createElement("ul");
                resultsList.classList.add("search-results");

                if (Array.isArray(data)) {
                    const total = data.length;
                    data.forEach(async (item, i) => {
                        status.value = `Displaying ${i}/${total}`;
                        const listItem = document.createElement("li");
                        listItem.textContent = item[0];
                        resultsList.appendChild(listItem);

                        const button = document.createElement("button");
                        button.textContent = "View File";
                        button.addEventListener("click", () => {
                            document.getElementById("preview").src =
                                server + "file?path=" + item[1];
                        });
                        listItem.appendChild(button);
                    });
                } else {
                    const listItem = document.createElement("li");
                    listItem.textContent = "No results found";
                    resultsList.appendChild(listItem);
                }

                const resultsContainer = document.getElementById("results");
                if (resultsContainer) {
                    resultsContainer.innerHTML = ""; // Clear previous results
                    resultsContainer.appendChild(resultsList);
                }
            }
        </script>
    </body>
</html>
