<!doctype html>
<html lang="en">
    <head>
        <title>HelpViewer Reader</title>
        <link id="style-import"
            rel="stylesheet"
            href="/style.css"
        ></link>
        <link id="favicon-import" rel="icon" type="image/x-icon" href="/favicon.ico">
        <script id="utils-import" src="/utils.js"></script>
    </head>
    <body>
        <header>
            <div id="title-area">
                <img alt="HelpViewer Reader Offline" src="logo.png">
            </div>
            <div id="credits-area">
                <p id="credits">developed by <a href="https://codeberg.org/lum1/">@lum1</a></p>
            </div>
        </header>
        <main>
            <form id="searchForm" action="javascript:void(0);">
                <div class="searchFormDivider">
                    <input type="text" id="terms" name="query" /><br /><br />
                    <input
                        type="submit"
                        value="Submit"
                        onclick="search(this.form.terms.value)"
                    />
                </div>
                <div class="searchFormDivider">
                    <label>Status</label>
                    <input
                        readonly="true"
                        id="status"
                        placeholder="Awaiting user ..."
                    />
                    <img
                        id="loading"
                        src="/loading.gif"
                        hidden="true"
                    />
                </div>
            </form>
            <div id="dabox">
                <div id="results">
                    <div id="controller">
                        <button onclick="step('prev')">Previous</button>
                        <label id="counter"></label>
                        <button onclick="step('next')">Next</button>
                    </div>
                </div>
                <aside id="preview_aside" style="float: right">
                    <iframe id="preview" href=""></iframe>
                </aside>
            </div>
        </main>
        <footer>
            <p>SPDX-License-Identifier: GPL-3.0 WITH bison-exception Copyright © 2024 lum1</p>
        </footer>
    </body>
</html>
